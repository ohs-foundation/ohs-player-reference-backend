codecov:
  notify:
    require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 70%
        threshold: 2%
        informational: false
    patch:
      default:
        target: 60%
        threshold: 5%
        informational: false

ignore:
  - "src/test/**"

comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: yes
  require_base: no
  require_head: yes

